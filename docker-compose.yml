services:
  app:
    build: .
    container_name: eleicao
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      - TZ=America/Fortaleza
    depends_on:
      - db

  db:
    image: mariadb:10.6
    container_name: db_container_name
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password_root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
      TZ: America/Fortaleza
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  vendor_data:
